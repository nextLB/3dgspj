{% extends 'base.html' %}
{% block title %}删除项目 - VastGaussian{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-exclamation-triangle"></i> 确认删除</h5>
            </div>
            <div class="card-body text-center py-5">
                <i class="fas fa-trash-alt fa-4x text-danger mb-3"></i>
                <h4>确定要删除项目「{{ project.name }}」吗？</h4>
                <p class="text-muted">此操作不可撤销。关联的任务记录和评估结果也将被删除。<br>（输出目录中的文件不会被删除）</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger btn-lg px-4"><i class="fas fa-trash"></i> 确认删除</button>
                        <a href="{% url 'projects:project_detail' project.id %}" class="btn btn-secondary btn-lg px-4"><i class="fas fa-arrow-left"></i> 返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
