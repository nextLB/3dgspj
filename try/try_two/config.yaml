# 3D Gaussian Splatting 配置文件 - RTX 3060优化版
# 版本: 2.0.2 (修复训练版)

# ==================== 系统配置 ====================
system:
  device: "cuda"
  num_workers: 2
  seed: 42
  deterministic: false

  # GPU优化设置
  cuda_optimizations:
    allow_tf32: true
    cudnn_benchmark: true
    memory_fraction: 0.8

# ==================== 数据集配置 ====================
dataset:
  root_path: "/home/next_lb/桌面/无人机影像三维重建任务/archive"
  scene: "bicycle"
  resolution: 2
  max_images: 30  # 进一步减少加载图像数量
  train_test_split: 0.9

# ==================== 模型配置 ====================
model:
  sh_degree: 0
  num_points: 20000  # 进一步减少初始点数

  # 高斯参数初始化
  initialization:
    position_scale: 0.01
    scaling_init: 0.01
    rotation_init: [1.0, 0.0, 0.0, 0.0]
    opacity_init: 0.1  # 减小初始不透明度
    color_init: "random"

# ==================== 训练配置 ====================
training:
  iterations: 1500  # 进一步减少迭代次数
  batch_size: 1
  gradient_accumulation: 1  # 禁用梯度累积，简化训练

  # 学习率设置
  learning_rate: 0.001
  learning_rate_schedule: "cosine"
  learning_rate_decay: 0.01

  # 优化器设置
  optimizer: "adamw"
  weight_decay: 0.01
  eps: 1e-15

  # 损失函数权重
  loss_weights:
    l1_weight: 1.0
    ssim_weight: 0.1
    lpips_weight: 0.0

  # 混合精度训练
  use_amp: true
  amp_dtype: "float16"

  # 安全设置
  clip_grad_norm: false  # 暂时禁用梯度裁剪
  grad_clip_max_norm: 1.0

  # 早停策略
  early_stopping:
    enabled: true
    patience: 100
    min_delta: 0.001

# ==================== 渲染配置 ====================
rendering:
  background_color: [1.0, 1.0, 1.0]
  tile_size: 16
  depth_threshold: 0.001

# ==================== 推理配置 ====================
inference:
  output_dir: "./inference_output"

  # 视频生成
  video:
    enabled: true
    num_frames: 30
    fps: 15
    resolution: [512, 512]

  # 相机轨迹
  camera_trajectory:
    radius_scale: 2.0