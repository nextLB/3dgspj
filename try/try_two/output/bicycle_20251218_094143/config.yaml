  \u7EC3 (use_amp: true)\n3. \u4F7F\u7528\u68AF\u5EA6\u7D2F\u79EF\u6A21\u62DF\u66F4\
  \u5927\u6279\u5927\u5C0F\n4. \u9650\u5236\u9AD8\u65AF\u70B9\u6570\u5728100k\u4EE5\
  \u5185\n\n## \u573A\u666F\u7279\u5B9A\u8C03\u6574:\n- \u7B80\u5355\u573A\u666F (bonsai):\
  \ \u53EF\u4F7F\u7528\u66F4\u5C11\u8FED\u4EE3\u548C\u9AD8\u65AF\u70B9\n- \u590D\u6742\
  \u573A\u666F (garden): \u9700\u8981\u66F4\u591A\u8FED\u4EE3\u548C\u9AD8\u65AF\u70B9\
  \n\n## \u6545\u969C\u6392\u9664:\n- \u5982\u679C\u663E\u5B58\u4E0D\u8DB3: \u964D\
  \u4F4E\u5206\u8FA8\u7387\u6216\u51CF\u5C11num_points\n- \u5982\u679C\u8BAD\u7EC3\
  \u4E0D\u7A33\u5B9A: \u964D\u4F4E\u5B66\u4E60\u7387\u6216\u589E\u52A0gradient_accumulation\n\
  - \u5982\u679C\u6E32\u67D3\u8D28\u91CF\u5DEE: \u589E\u52A0iterations\u6216\u4F7F\
  \u7528\u66F4\u9AD8\u5206\u8FA8\u7387\n"
output_dir: ./output
paths:
  cache_root: ./cache
