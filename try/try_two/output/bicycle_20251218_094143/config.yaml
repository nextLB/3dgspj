    cull_far_points: true
    precompute_covariance: true
    sort_by_depth: true
  tile_size: 16
resolution: 2
rtx3060_optimizations:
  memory:
    max_batch_size: 1
    max_images: 100
    max_points: 100000
    use_gradient_checkpointing: false
  performance:
    use_cudnn_benchmark: true
    use_fp16_arithmetic: true
    use_optimized_kernels: true
    use_tf32: true
