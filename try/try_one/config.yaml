# 实验配置
experiment:
  name: "3dgs_experiment"
  seed: 42
  device: "cuda"
  use_wandb: true

# 数据配置
data:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  image_size: [800, 800]
  num_workers: 4

# 模型配置
model:
  max_gaussians: 100000
  sh_degree: 3
  init_points: 10000
  densify_interval: 100
  prune_interval: 100

# 训练配置
training:
  epochs: 1000
  batch_size: 1
  lr_milestones: [500, 800]
  lr_gamma: 0.5
  val_freq: 10
  save_freq: 50

  # 学习率
  position_lr: 0.00016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001

# 损失配置
loss:
  lambda_dssim: 0.2
  use_tv_loss: false
  tv_weight: 0.001

# 评估配置
evaluation:
  metrics: ["psnr", "ssim", "lpips"]
  render_views: 20